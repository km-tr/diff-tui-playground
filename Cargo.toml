[package]
name = "git-review-tui"
version = "1.0.0"
edition = "2021"
description = "A TUI tool for reviewing Git diffs"
license = "MIT"
readme = "README.md"
keywords = ["git", "diff", "tui", "review"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-review-tui"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization / Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# File watching
notify = "7"
notify-debouncer-mini = "0.5"

# Async channels
crossbeam-channel = "0.5"

# Clipboard
arboard = "3"

# Fuzzy matching
fuzzy-matcher = "0.3"

# Path/Dir utilities
dirs = "6"

# URL parsing (for WezTerm cwd)
url = "2"

# Regex (for parsing)
regex = "1"

[dev-dependencies]
tempfile = "3"
insta = "1"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
